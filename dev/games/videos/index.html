<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who-does-what clips</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 16px; background: #fffaf0; color: #3b2a1a; }
  p { max-width: 62em; }
  table { border-collapse: collapse; }
  th { text-align: left; padding: 4px 8px; }
  td { padding: 4px; vertical-align: top; }
  video { width: 300px; border-radius: 8px; border: 1px solid #ead9bb; background: #fff; display: block; }
  .name { font-size: 13px; color: #6b4a2b; }
</style>
<h1>Who-does-what clips</h1>
<p>The 20 clips the Puppet Theatre and Windows games play (one per animal and action), looping, without sound.
  Watch for: the animal doing the action named, motion that looks natural, and nothing odd: changing shape,
  extra or missing legs, sliding feet, a different animal.</p>
<p><b>Mode:</b> <label><input type="radio" name="m" value="orig" checked> the clips as generated</label>
  <label><input type="radio" name="m" value="loop"> loop versions for Windows (cut between two near-identical frames, so the loop has no jump back; 2.5 to 4.7 s)</label></p>
<table id="t"></table>
<script>
  const animals = ['dog', 'chicken', 'cow', 'rabbit'], actions = ['sleep', 'eat', 'run', 'walk', 'drink'];
  const t = document.getElementById('t');
  const src = (n) => (document.querySelector('input[name=m]:checked').value === 'loop' ? '../art_candidates/combo_loops/' : '../art/combo/') + n + '.mp4';
  function draw() {
  t.innerHTML = '<tr><th></th>' + actions.map((a) => `<th>${a}</th>`).join('') + '</tr>' +
    animals.map((an) => `<tr><th>${an}</th>` + actions.map((a) =>
      `<td><video src="${src(an + '_' + a)}" poster="../art/combo/${an}_${a}.png" autoplay muted loop playsinline></video><div class="name">${an}_${a}</div></td>`).join('') + '</tr>').join('');
  }
  draw();
  document.querySelectorAll('input[name=m]').forEach((r) => r.onchange = draw);
</script>
