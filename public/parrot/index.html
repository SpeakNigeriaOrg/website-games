<!doctype html>
<html lang="yo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silly Parrot</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<link rel="stylesheet" href="../engine/engine.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <img class="bg" src="../art/bg_jungle.png" alt="">
  <div class="layout playfield" id="field">
    <div class="parrot-area" id="parrotArea">
      <div class="parrot" id="parrot">
        <img class="parrot-img" src="../art/parrot.png" alt="">
        <div class="sign" id="sign"></div>
        <div class="bubble" id="bubble"></div>
      </div>
    </div>
    <div class="buttons">
      <button class="big-btn seed-btn" id="seedBtn" aria-label="seed" data-choice>
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <path d="M28 52 Q20 100 34 108 Q60 118 86 108 Q100 100 92 52 Z" fill="#c8995a" stroke="#4a3018" stroke-width="4" stroke-linejoin="round"/>
          <path d="M36 70 Q60 76 84 70 M38 88 Q60 94 82 88" fill="none" stroke="#a87a3e" stroke-width="3" stroke-linecap="round"/>
          <path d="M30 52 Q36 40 46 44 Q60 34 74 44 Q86 40 90 52 Q60 62 30 52 Z" fill="#e0b675" stroke="#4a3018" stroke-width="4" stroke-linejoin="round"/>
          <path d="M40 44 Q48 26 60 36 Q72 24 80 44" fill="#3a2a14" stroke="#4a3018" stroke-width="3"/>
          <g stroke="#3a2a14" stroke-width="2">
            <ellipse cx="50" cy="34" rx="5" ry="8" fill="#f4e0a8" transform="rotate(-25 50 34)"/>
            <ellipse cx="62" cy="28" rx="5" ry="8" fill="#fff2c4"/>
            <ellipse cx="72" cy="35" rx="5" ry="8" fill="#f4e0a8" transform="rotate(25 72 35)"/>
            <ellipse cx="22" cy="104" rx="4.5" ry="7" fill="#f4e0a8" transform="rotate(-60 22 104)"/>
            <ellipse cx="100" cy="106" rx="4.5" ry="7" fill="#fff2c4" transform="rotate(55 100 106)"/>
          </g>
          <path d="M34 54 Q60 64 86 54" fill="none" stroke="#d24a2a" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="big-btn hammer-btn" id="hammerBtn" aria-label="hammer" data-choice>
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <rect x="54" y="44" width="13" height="66" rx="6" fill="#3f7cd9" stroke="#1d2f55" stroke-width="4"/>
          <rect x="54" y="88" width="13" height="10" fill="#f2b33d" stroke="#1d2f55" stroke-width="3"/>
          <g transform="rotate(-8 60 34)">
            <rect x="24" y="16" width="72" height="36" rx="14" fill="#e4572e" stroke="#5a1a0a" stroke-width="4"/>
            <rect x="14" y="12" width="16" height="44" rx="7" fill="#f2b33d" stroke="#5a1a0a" stroke-width="4"/>
            <rect x="90" y="12" width="16" height="44" rx="7" fill="#f2b33d" stroke="#5a1a0a" stroke-width="4"/>
            <path d="M36 24 Q56 20 78 24" fill="none" stroke="#ffb59e" stroke-width="5" stroke-linecap="round"/>
          </g>
        </svg>
      </button>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
