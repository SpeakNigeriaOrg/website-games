<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak Nigeria - Tone Game</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- ?v= query strings bust browser/CDN caches on asset changes: Pages
         serves HTML with max-age=0 but assets with a fixed 4-hour cache it
         won't let _headers override (verified empirically - custom security
         headers apply to assets, Cache-Control overrides don't). Bump the
         version whenever the file meaningfully changes. Each game keeps its
         own counter, so this one starts at 1. -->
    <link rel="stylesheet" href="tokens.css?v=1">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <!-- The first tap in here is mandatory (see app.js's backdrop guard), which
         is also what unlocks audio playback - that's what lets loadWord()
         autoplay the word without the browser blocking it. -->
    <div id="start-overlay">
        <div id="playlist-menu">
            <h2>Choose a playlist</h2>
            <!-- Enabled by app.js once the data loads and real per-category
                 level counts are known (see initializePlaylistMenu). Themed
                 and Random come straight from sessions.json's own `category`
                 field; Tone Patterns is generated by buildTonePatternLevels,
                 which replaces sessions.json's own tone_pattern levels.
                 sessions.json's fourth category, syllable_reinforcement, is
                 deliberately not offered - see OFFERED_CATEGORIES in app.js
                 for why it means nothing in a game with no syllable bank. -->
            <button class="playlist-btn" data-category="tone_pattern" onclick="selectPlaylist('tone_pattern')" disabled>Tone Patterns</button>
            <button class="playlist-btn" data-category="themed" onclick="selectPlaylist('themed')" disabled>Themed Levels</button>
            <button class="playlist-btn" data-category="endless_practice" onclick="selectPlaylist('endless_practice')" disabled>Random</button>
        </div>
    </div>

    <div id="app-wrapper">
        <!-- Slim brand bar, not a hero block: a small wordmark plus the
             theme control, kept to a single compact row so the game
             itself gets almost the entire viewport. -->
        <header id="top-bar">
            <a id="brand-mark" href="/" aria-label="Back to Speak Nigeria Games">
                <img src="favicon.svg" alt="" width="18" height="18">
                Speak Nigeria
            </a>
            <div id="top-bar-controls">
                <button id="playlist-btn-change" class="icon-btn icon-btn-small" onclick="showPlaylistMenu()" aria-label="Change playlist" title="Change playlist">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 6h16M4 12h10M4 18h16"/>
                    </svg>
                </button>
                <select id="theme-selector" aria-label="Choose a level" title=""></select>
                <button id="fullscreen-btn" class="icon-btn icon-btn-small" onclick="toggleFullscreen()" aria-label="Toggle fullscreen" title="Toggle fullscreen">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
                    </svg>
                </button>
            </div>
        </header>

        <main id="game-container">

            <!-- Back/forward navigation flanks the image (symmetric pair),
                 not a separate text-button row. -->
            <div id="stage-row">
                <button id="prev-btn" class="icon-btn" onclick="prevWord()" aria-label="Previous word" title="Previous word">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M18 5l-8 7 8 7V5z"/>
                        <rect x="5.5" y="5" width="2.5" height="14" rx="1"/>
                    </svg>
                </button>

                <div id="prompt-container" class="prompt-container" onclick="playFullWordAudio()">
                    <img id="prompt-image" src="" alt="Listen and pick the tones" />

                    <div class="audio-overlay">
                        <svg fill="#ffffff" viewBox="0 0 24 24" width="40px" height="40px">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                    </div>

                    <div id="correct-badge" class="correct-badge" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="56px" height="56px">
                            <circle cx="12" cy="12" r="11" fill="var(--accent-courses)"/>
                            <path d="M6.5 12.5l3.5 3.5 7.5-8" stroke="white" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>

                </div>

                <button id="skip-btn" class="icon-btn" onclick="skipWord()" aria-label="Skip word" title="Skip word">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M6 5l8 7-8 7V5z"/>
                        <rect x="16" y="5" width="2.5" height="14" rx="1"/>
                    </svg>
                </button>
            </div>

            <!-- Transient feedback (correct/skip/error/level-complete
                 messages) as a floating overlay (fixed-positioned, see
                 style.css), not a permanently-reserved text line. -->
            <div id="toast" role="status" aria-live="polite"></div>

            <!-- Hint toggle sits beside the syllable cards, but the cards
                 (not the row as a whole) are what's centered on the page -
                 the 3-column grid below keeps the hint ancillary rather
                 than shifting the cards off-center. -->
            <div id="answer-row">
                <button id="hint-btn" class="icon-btn icon-btn-small" onclick="toggleToneHint()" aria-label="Toggle tone hint" title="Show tone hint">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1.1 1 1.8v.5h6v-.5c0-.7.4-1.4 1-1.8A7 7 0 0 0 12 2z" fill="currentColor"/>
                        <rect x="9" y="18.5" width="6" height="1.6" rx="0.8" fill="currentColor"/>
                        <rect x="9.7" y="20.6" width="4.6" height="1.4" rx="0.7" fill="currentColor"/>
                    </svg>
                </button>

                <!-- One card per syllable, built by app.js's renderCards().
                     Tone-hint dots for each card are always in the DOM but
                     only visible while #hint-btn is toggled on
                     (cards-container.show-hint). -->
                <div id="syllable-cards" class="cards-container"></div>

                <!-- Empty spacer, same grid column width as hint-btn's
                     column, so the middle (cards) column is truly centered
                     in the row rather than centered-minus-the-hint-button's-width. -->
                <div aria-hidden="true"></div>
            </div>

            <!-- The fully tone-marked spelling, hidden until the word is
                 solved - the cards deliberately show tone-stripped syllables
                 until then, so revealing this is the payoff. -->
            <div id="word-reveal" aria-live="polite"></div>

            <!-- Low to high, left to right - the direction pitch runs on a
                 stave, and the direction the three pitch lines now climb
                 across the row. Labelled Do/Re/Mi rather than Low/Mid/High:
                 solfege names a pitch you sing rather than a category you
                 memorise, and the class names stay high/mid/low so app.js and
                 the colour mapping are untouched. The labels carry Yoruba tone
                 marks themselves - Do grave, Re bare, Mi acute - so the button
                 demonstrates the very diacritic it stands for, which is the
                 mark the player is being asked to hear. They use --font-yoruba
                 (see style.css) for the same reason the cards do: that stack is
                 picked for diacritic coverage. The arrow badges and the
                 measured pitch lines are what carry the actual meaning, so
                 nothing is lost by dropping the English words - and the tone
                 name is kept in aria-label and title for screen readers. -->
            <div id="tone-bank" class="tone-bank">

                <div class="tone-group tone-group-low">
                    <span class="tone-badge" title="Low tone">&#8600;</span>
                    <button class="tone-btn btn-low" onclick="handleTonePick('low')" aria-label="Dò, low tone">
                        <span class="tone-btn-label">Dò</span>
                        <!-- Pitch line drawn from TONE_MODEL's measured glide
                             (see app.js's renderTonePitchLines) - the tone's
                             real shape, not a decorative squiggle. -->
                        <svg class="tone-line" viewBox="0 0 60 24" width="60" height="24" aria-hidden="true" preserveAspectRatio="none"></svg>
                    </button>
                </div>
                <div class="tone-group tone-group-mid">
                    <span class="tone-badge" title="Mid tone">&#8594;</span>
                    <button class="tone-btn btn-mid" onclick="handleTonePick('mid')" aria-label="Re, mid tone">
                        <span class="tone-btn-label">Re</span>
                        <svg class="tone-line" viewBox="0 0 60 24" width="60" height="24" aria-hidden="true" preserveAspectRatio="none"></svg>
                    </button>
                </div>
                <div class="tone-group tone-group-high">
                    <span class="tone-badge" title="High tone">&#8599;</span>
                    <button class="tone-btn btn-high" onclick="handleTonePick('high')" aria-label="Mí, high tone">
                        <span class="tone-btn-label">Mí</span>
                        <svg class="tone-line" viewBox="0 0 60 24" width="60" height="24" aria-hidden="true" preserveAspectRatio="none"></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js?v=3"></script>
</body>
</html>
