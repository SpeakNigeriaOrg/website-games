<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak Nigeria - Story Game</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- ?v= query strings bust browser/CDN caches on asset changes: Pages
         serves HTML with max-age=0 but assets with a fixed 4-hour cache it
         won't let _headers override. Bump the version whenever the file
         meaningfully changes. -->
    <link rel="stylesheet" href="tokens.css?v=1">
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
    <!-- Story picker doubles as the start overlay: its tap is the user
         gesture that unlocks the AudioContext, so it shows even when
         only one story exists. -->
    <div id="start-overlay">
        <div id="story-menu">
            <h2>Yan ìtàn kan <span class="subtitle">Choose a story</span></h2>
            <div id="story-cards"></div>
        </div>
    </div>

    <div id="app-wrapper">
        <header id="top-bar">
            <a id="brand-mark" href="/" aria-label="Back to Speak Nigeria Games">
                <img src="favicon.svg" alt="" width="18" height="18">
                Speak Nigeria
            </a>
            <div id="top-bar-controls">
                <button id="stories-btn" class="icon-btn icon-btn-small" onclick="showStoryMenu()" aria-label="Choose another story" title="Choose another story">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 6h16M4 12h10M4 18h16"/>
                    </svg>
                </button>
                <button id="fullscreen-btn" class="icon-btn icon-btn-small" onclick="toggleFullscreen()" aria-label="Toggle fullscreen" title="Toggle fullscreen">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
                    </svg>
                </button>
            </div>
        </header>

        <main id="game-container">
            <div id="instruction-bar">
                <p id="instruction-text" lang="yo"></p>
                <div id="found-counter" aria-live="polite"></div>
            </div>

            <div id="stage">
                <img id="scene-img" src="" alt="Story scene">
                <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>

                <!-- Scene-complete card: the after-description slides up
                     over the bottom of the scene once every target is found. -->
                <div id="after-sheet" hidden>
                    <p id="after-text" lang="yo"></p>
                    <button id="continue-btn" onclick="nextScene()">Tẹ̀síwájú →</button>
                </div>
            </div>

            <div id="toast" role="status" aria-live="polite"></div>

            <!-- Story-complete screen, swapped in for the stage. -->
            <div id="congrats" hidden>
                <svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true">
                    <circle cx="12" cy="12" r="11" fill="var(--accent-courses)"/>
                    <path d="M6.5 12.5l3.5 3.5 7.5-8" stroke="white" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h2 lang="yo">Kú oríire! O ti parí ìtàn náà.</h2>
                <p class="subtitle">Congratulations - you finished the story!</p>
                <div id="congrats-buttons">
                    <button class="big-btn" onclick="replayStory()">Tún ṣe é <span class="subtitle">Play again</span></button>
                    <button class="big-btn" onclick="showStoryMenu()">Yan ìtàn mìíràn <span class="subtitle">Another story</span></button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js?v=1"></script>
</body>
</html>
